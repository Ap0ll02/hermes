name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes_pm

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Build release
        run: cargo build --release --verbose
      
      - name: Strip binary
        run: strip target/release/hermes
      
      - name: Create tarball
        run: |
          tar -czf hermes-${{ steps.get_version.outputs.VERSION }}-x86_64-linux.tar.gz \
            -C target/release hermes
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            hermes-${{ steps.get_version.outputs.VERSION }}-x86_64-linux.tar.gz
          body: |
            ## Hermes v${{ steps.get_version.outputs.VERSION }}
            
            ### Installation
```bash
            tar -xzf hermes-${{ steps.get_version.outputs.VERSION }}-x86_64-linux.tar.gz
            sudo mv hermes /usr/local/bin/
```
            
            ### Changes
            See commits for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
